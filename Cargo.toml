[package]
name = "equinox"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "System-wide parametric EQ for Windows: per-device profiles, AutoEq headphone correction, automation and a CLI"
license = "CC-BY-NC-4.0"
repository = "https://github.com/visiuun/equinox"
readme = "README.md"
keywords = ["equalizer", "audio", "autoeq", "equalizer-apo", "windows"]
categories = ["multimedia::audio", "command-line-utilities"]
publish = false

[lib]
name = "equinox"
path = "src/lib.rs"

# The app: window, plus `--tray` for the background agent.
[[bin]]
name = "equinox"
path = "src/main.rs"

# The command line, as a console program so output and pipes behave.
[[bin]]
name = "eqx"
path = "src/bin/eqx.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
ureq = "2"
winreg = "0.56"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
